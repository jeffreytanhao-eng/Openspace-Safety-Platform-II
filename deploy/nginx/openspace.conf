# 开源太空安全平台 —— nginx 站点配置
# 容器内监听 1233，托管前端静态包，并把 /cgi、/uploads 反代到 api:1234
#
# 说明：
#   · gzip_static on 直接下发 vite-plugin-compression 生成的 .gz 预压缩文件；
#   · index.html 不缓存，避免发版后浏览器拿旧入口；
#   · /cesium/ 为 Cesium 运行时资源（Workers / Assets / ThirdParty / Widgets），命中缓存即可。

server {
    listen       1233;
    listen       [::]:1233;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 32m;

    # 预压缩产物 + 运行时兜底压缩
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 入口与 SPA 路由：永远回落到 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Cesium 运行时资源
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 后端统一接口前缀
    location /cgi/ {
        proxy_pass         http://api:1234;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 上传/静态文件（后端 express.static 托管）
    location /uploads/ {
        proxy_pass         http://api:1234;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
