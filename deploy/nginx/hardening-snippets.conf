# 合并进生产站点配置（/etc/nginx/sites-available/openspace），不要用本仓库 deploy/nginx/openspace.conf 整份覆盖生产（那份是容器/本机 1233 配置）。
# 每次改 nginx 后：nginx -t && systemctl reload nginx

# 1) 所有 server 块内：禁止下载备份/环境文件（避免 try_files 把 .bak 当静态文件吐出）
location ~* \.(bak|sql|env)(\.|$) {
    deny all;
}

# 2) 仅在 443 的 server 块内（域名 HTTPS），不要加到仅 IP 的 80 块：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
