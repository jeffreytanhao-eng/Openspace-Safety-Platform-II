# 开源太空安全平台 —— Docker Compose（阿里云 Linux 轻量服务器）
#
# 使用：
#   cd deploy
#   cp .env.example .env      # 按需修改端口 / 数据库口令
#   docker compose up -d --build
#
# 对外：
#   http://<服务器IP>:1233      前端 + /cgi 反向代理
#   http://<服务器IP>:1234/cgi  后端直连（调试用，可在防火墙关闭）
#
# MySQL 为可选服务：默认不启动（api 连不上库也会正常启动，/cgi/health 返回 db:'down'）。
# 需要本地库时：docker compose --profile mysql up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: openspace-safety-api:1.0.0
    container_name: openspace-api
    restart: unless-stopped
    environment:
      PORT: 1234
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-openspace}
      DB_PASSWORD: ${DB_PASSWORD:-openspace}
      DB_NAME: ${DB_NAME:-openspace}
      # 静态资源前缀（前端 /cgi/config 读取；未配置时为空串）
      STATIC_BASE: ${STATIC_BASE:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "1234"
    ports:
      # 仅调试用；安全起见可注释掉，只经 web 的 1233 访问 /cgi
      - "${API_PORT:-1234}:1234"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/cgi/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # 部署在域名子路径时改成 /xxx/
        VITE_BASE: ${VITE_BASE:-/}
    image: openspace-safety-web:1.0.0
    container_name: openspace-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-1233}:1233"

  mysql:
    image: mysql:8.0
    container_name: openspace-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-openspace}
      MYSQL_USER: ${DB_USER:-openspace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-openspace}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  uploads:
  mysql-data:
